<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .container {
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background-color: #fff;
            width: 80%;
            /* max-width: 400px; */
            height: 50%;
            /* box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); */
            border-radius: 10px 0 0 10px;
            padding: 40px;
            /* padding: 0 ; */
            /* padding-left: 40px;
            padding-right: 40px; */
            /* margin-right: 100px; */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-div {
            width: 60%;
        }


        .login-box h2 {
            margin-bottom: 70px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
           
            padding-bottom: 10px;
        }

        .input-group i {
      
            color: #002366;
        }

        .input-group input {
            width: 100%;
            padding: 15px 5px;
            border: 1px solid #ddd;
            outline: none;
            border-radius: 8px; /* Use 8px for a subtle curve */
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #002366;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #002366;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #01153a;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            color: #002366;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .login-image {
            height: 100vh;
            display: none;
            /* background-color: #b10b0b; */
            color: #fff;
            border-radius: 10px;
            align-items: center;
            justify-content: center;
            text-align: center;
            display: flex;
            flex-direction: column;
            width: 50%;

        }

        .login-image img {
            height: 90vh;
            border-radius: 10px;
            width: 90%;
            /* margin-right: 10px; */
            /* width: 100%; */
            /* border-radius: 10px; */
        }
        .notification{
            display:flex;
            justify-content:center;
    
        }
        .flash-messages {
            background-color: #f00; /* Red with transparency */
            width:100%;
            padding: 10px;
            text-align: center; 
            color: white; /* Suitable text color */
            border-radius: 10px; /* Rounded corners */
            backdrop-filter: blur(10px); /* Glass-like blur effect */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Subtle shadow for depth */
            border: 1px solid rgba(255, 255, 255, 0.2); /* Light border for contrast */
            list-style-type:none;
        }
        
        

        @media (min-width: 768px) {
            .login-box {
                width: 50%;
            }

            .login-image {
                display: flex;
            }
        }

        @media only screen and (max-width: 767px) {
            /* body {
          background-color: lightblue;
        } */

            .login-box {
                width: 100%;
            }

            .login-box .form-div {
                width: 100%;
            }

            .login-image {
                display: none;
                /* width: 50%; */
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha512-Fo3rlrZj/k7ujTnHg4CGR2DhKN3FZSBnkwAQp5B5vdf6mQzqqblb66FQkDl1/E+OQhjGR6m8LLmPAnIsyO4Tg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<header>
    
</header>

<body>
    <div class="container">
        <div class="login-box">
            <div class="form-div">
                <h1 style="font-family: Arial, sans-serif; font-size: 2.5rem; font-weight: bold; color: #002366;">
                    Login In
                </h1>
                <h6 style="font-family: Arial, sans-serif; font-size: 1.0rem; font-weight: normal; color: #666;">
                    Welcome to Quick Omr !
                    <span style="font-weight: bold;color: #007bff;">Check Faster Omr Sheet</span>
                </h6>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <label for="email">Email Id</label><br><br>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <label for="password">Password</label><br><br>
                    <div class="input-group" style="margin-bottom: 40px;">
                        
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
                
              <!--<div class="signup-link">
                    Don't have an account? <a href="{{ url_for('auth.register') }}">Signup now</a>
                </div>-->

                <div class="notification">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <ul class="flash-messages">
                    {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
                {% endif %}
                {% endwith %}
            </div>
            </div>

          
        </div>
        <div class="login-image">
            <img src="{{ url_for('static', filename='img/school.jpg') }}" alt="Login Image">

        
        </div>
    </div>
</body>

</html>

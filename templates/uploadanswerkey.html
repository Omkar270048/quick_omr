{% extends "base.html" %}

{% block title %}Upload Answer Key{% endblock %}

{% block content %}
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        padding: 0;
    }
    .container-fluid {
        width: calc(100% - 250px); 
        margin-left: 0;
        margin-right: 0; 
       
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }
    h1 {
        margin-bottom: 24px;
        color: #343a40;
        text-align: center;
        font-size: 1.75rem;
    }
    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        font-size: 1rem;
        color: #495057;
    }
    .file-input {
        width: auto;
        max-width: auto;
    }
    .text-center {
        text-align: center;
    }
    .text-right {
        text-align: right;
    }
    .mt-4 {
        margin-top: 1.5rem;
    }
    .mb-4 {
        margin-bottom: 1.5rem;
    }
</style>

<div class="container-fluid mt-3">
    <h1>Upload Answer Key</h1>

    <!-- Download Template Button -->
    <div class="text-right mb-4" style="display: flex; justify-content: center; align-items: center;">
        <a href="{{ url_for('upload.download_template') }}" class="btn btn-primary" style="text-decoration:none;">Download CSV Template</a>
    </div>

    <!-- Upload Form -->
    <form action="{{ url_for('upload.upload_answer_key') }}" method="post" enctype="multipart/form-data">
        <div class="mb-3" style="display: flex; flex-direction: column; align-items: center;">
            <label for="file" class="form-label">Choose CSV file:</label>
            <input type="file" id="file" name="file" accept=".csv" class="form-control file-input" required>
        </div>
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">Upload</button>
        </div>
    </form>
</div>

<!-- Display a JavaScript alert if there's a message -->
{% if message %}
<script>
    alert("{{ message }}");
</script>
{% endif %}

{% endblock %}
